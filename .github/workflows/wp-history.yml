name: wp-history

# Walk the archives of publishers that refuse Cloudflare, from ordinary
# datacenter IPs, and hand each page back to the walker Worker.
#
# Separate from `relay` on purpose. That job fetches today's news for 92
# sources and must finish in well under its window; this one is a long crawl
# that deliberately runs to a time budget and resumes next time. Sharing a
# workflow would mean one starving the other, and sharing a concurrency group
# would mean the news waiting behind the history.
#
# BACK TO HOURLY, 2026-08-02. It ran daily for a day because the four archives
# it was built for refused /wp-json/ from these runners too — Cloudflare's
# "Just a moment" challenge on two, Akamai on geetha.mil.gr, plain 403s on the
# rest. What was never tried is that WordPress paginates its FEED with its own
# lock: /feed/?paged=N, a different surface, and these same four already prove
# it works — the daily `relay` job has fetched their /feed/ every thirty
# minutes throughout. The walker Worker now speaks that surface, and this job
# hands it pages the same way it always has: fetch the URL /relay/domains
# gives, POST the bytes to /relay/page.
#
# EVERY 20 MINUTES, 2026-08-03. As of that date this job is cyprustimes.com's
# ONLY route — it answers a Cloudflare challenge to the walker Worker itself,
# from every colo tried, so there is no faster lane to move it to. At 97
# pages per 9-minute run the archive (421,770 posts, cursor then at page 733)
# was ~18 days out at hourly cadence; three runs an hour instead of one cuts
# that to ~6-9 days at the same per-request pacing, since each run is still
# capped at BUDGET_MS. `concurrency.group` + `cancel-in-progress: false` below
# already serialise runs, and the 12-minute job timeout is comfortably under
# 20, so runs cannot overlap.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: wp-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    # The script stops itself at 9 minutes; this is the backstop, not the plan.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Relay archive pages to the walker
        env:
          WALK_URL: ${{ secrets.WALK_URL }}
          WALK_SECRET: ${{ secrets.WALK_SECRET }}
        run: node wp-history.mjs
