name: wp-history

# Walk the archives of publishers that refuse Cloudflare, from ordinary
# datacenter IPs, and hand each page back to the walker Worker.
#
# Separate from `relay` on purpose. That job fetches today's news for 92
# sources and must finish in well under its window; this one is a long crawl
# that deliberately runs to a time budget and resumes next time. Sharing a
# workflow would mean one starving the other, and sharing a concurrency group
# would mean the news waiting behind the history.
# ⚠ AS OF 2026-08-02 THIS HAS ZERO WORKING CUSTOMERS, AND THAT IS WORTH SAYING
# OUT LOUD RATHER THAN LEAVING SOMEBODY TO DISCOVER IT.
#
# It was built for the seven archives the tokastoraki Worker cannot reach. The
# first run proved they refuse these runners too — Cloudflare's "Just a moment"
# challenge on defence-point.gr and agriniopress.gr, Akamai "Access Denied" on
# geetha.mil.gr, plain 403s on the rest. The decisive detail is that the SAME
# runners fetch those same sites' /feed/ successfully every thirty minutes, so
# it is the /wp-json/ PATH they block, not our location: a common WordPress
# hardening, and nothing a different egress can talk its way past. Those
# archives stay on the Internet Archive lane, which reads web.archive.org
# rather than the publisher, and therefore still works.
#
# So this runs DAILY, not hourly: there is currently nothing for it to do, and
# an hourly job that fails 7 out of 7 for ever is noise pretending to be a
# safeguard. Daily is enough to notice a publisher lifting a block, on archives
# that have already waited years. If one ever does, this starts working with no
# further change — which is the whole reason it stays.
on:
  schedule:
    - cron: "25 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: wp-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    # The script stops itself at 9 minutes; this is the backstop, not the plan.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Relay archive pages to the walker
        env:
          WALK_URL: ${{ secrets.WALK_URL }}
          WALK_SECRET: ${{ secrets.WALK_SECRET }}
        run: node wp-history.mjs
