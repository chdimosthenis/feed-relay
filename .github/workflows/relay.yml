name: relay

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: relay-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Relay publisher payloads to the fetcher
        env:
          FETCHER_URL: ${{ secrets.FETCHER_URL }}
          FETCHER_SECRET: ${{ secrets.FETCHER_SECRET }}
        run: node relay.mjs
